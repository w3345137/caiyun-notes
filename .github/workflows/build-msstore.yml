name: Build MS Store (MSIX)

# 云端打包 Microsoft Store 版（MSIX，商店代签零证书路线）。
# 商店身份必须与 Partner Center 中彩云笔记（Store ID 9P2VQP7JKVLN）一致。
# 手动输入可用于排障；正常发布使用此处已核对的正式身份。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example p16
        required: true
        type: string
      identity_name:
        description: Package/Identity/Name（留空用正式身份）
        required: false
        type: string
      publisher:
        description: Package/Identity/Publisher（CN=...，留空用正式身份）
        required: false
        type: string
      publisher_display_name:
        description: PublisherDisplayName（留空用正式身份）
        required: false
        type: string

jobs:
  build-msix:
    runs-on: windows-latest
    env:
      MSSTORE_IDENTITY_NAME: ${{ github.event.inputs.identity_name || 'BinApp.547813EA77836' }}
      MSSTORE_PUBLISHER: ${{ github.event.inputs.publisher || 'CN=49D17C52-EB55-4439-9F79-0DFACFCB393C' }}
      MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ github.event.inputs.publisher_display_name || 'BinApp' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate bundled frontend
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/app-dist-manifest.json

      - name: Validate store identity inputs
        shell: bash
        run: |
          test -n "$MSSTORE_IDENTITY_NAME" || { echo "::error::缺少 Identity Name（输入或仓库 Variable MSSTORE_IDENTITY_NAME）"; exit 1; }
          test -n "$MSSTORE_PUBLISHER" || { echo "::error::缺少 Publisher（输入或仓库 Variable MSSTORE_PUBLISHER）"; exit 1; }
          test -n "$MSSTORE_PUBLISHER_DISPLAY_NAME" || { echo "::error::缺少 PublisherDisplayName"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Validate Microsoft Store compliance boundaries
        run: npm run test:msstore-compliance

      - name: Build store variant (no self-updater)
        shell: bash
        run: npm run build:msstore -- --target x86_64-pc-windows-msvc

      - name: Scan store binary for forbidden code download paths
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-msstore-binary.ps1

      - name: Pack exact x64 MSIX artifact
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/pack-msix.ps1 `
            -IdentityName "$env:MSSTORE_IDENTITY_NAME" `
            -Publisher "$env:MSSTORE_PUBLISHER" `
            -PublisherDisplayName "$env:MSSTORE_PUBLISHER_DISPLAY_NAME" `
            -ExePath "src-tauri/target/x86_64-pc-windows-msvc/release/app.exe"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: caiyun-notes-msix-${{ github.run_id }}
          path: build/msix/*.msix
          if-no-files-found: error
