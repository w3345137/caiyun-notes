name: Sync Official Windows EXE

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Promote Qualified Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-official-windows-exe
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Verify official release installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 .github/scripts/prepare-windows-exe.py
          cp .github/scripts/publish-windows-exe.py windows-exe-stage/publish.py
      - name: Upload verified installer to Tencent Cloud staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: windows-exe-stage/CaiyunNotes-x64-Setup.exe,windows-exe-stage/release.json,windows-exe-stage/publish.py
          target: /cloudnotes/updates-staging/windows-exe-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
      - name: Activate download and remove staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            stage=/cloudnotes/updates-staging/windows-exe-${{ github.run_id }}-${{ github.run_attempt }}
            trap 'rm -f "$stage/CaiyunNotes-x64-Setup.exe" "$stage/release.json" "$stage/publish.py"; rmdir "$stage"' EXIT
            python3 "$stage/publish.py" "$stage" /cloudnotes/updates/windows
      - name: Verify Tencent Cloud download
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 90 https://notes.binapp.top/updates/windows/latest.exe -o /tmp/caiyun-windows-latest.exe
          python3 - <<'PY'
          import hashlib, json, pathlib
          expected = json.loads(pathlib.Path('windows-exe-stage/release.json').read_bytes())['sha256']
          actual = hashlib.sha256(pathlib.Path('/tmp/caiyun-windows-latest.exe').read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit('The public EXE does not match the verified GitHub release')
          PY
