name: Build Signed Draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example p16
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform == 'windows-latest' && vars.WINDOWS_SIGNING_RUNNER || matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate bundled frontend
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/app-dist-manifest.json
          node -e "const fs=require('fs'),p=require('./package.json'),t=require('./src-tauri/tauri.conf.json'),m=require('./dist/app-dist-manifest.json'),c=require('./src-tauri/capabilities/default.json'),q=c.permissions,r=fs.readFileSync('./src-tauri/src/lib.rs','utf8'),g=fs.readFileSync('./src-tauri/Cargo.toml','utf8');if(p.version!==t.version||p.version!==m.appVersion||t.app.windows[0].url!=='index.html'||!r.includes('WindowEvent::CloseRequested')||!r.includes('TrayIconBuilder')||!r.includes('RunEvent::Reopen')||!r.includes('RunEvent::ExitRequested')||!r.includes('complete_app_exit')||!g.includes('tauri-plugin-single-instance')||q.includes('core:window:allow-close')||q.includes('core:window:allow-destroy')||q.includes('process:allow-exit'))process.exit(1)"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Validate visible app release identity
        env:
          NOTES_EXPECT_RELEASE_LABEL: ${{ inputs.tag }}
        run: node .github/scripts/validate-app-release-identity.cjs

      - name: Validate native shell
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Prepare native bundle configuration
        shell: bash
        run: |
          if test -f scripts/prepare-native-speech.mjs; then
            node scripts/prepare-native-speech.mjs --target "${{ matrix.target }}" --output speech-bundle-config.json
          else
            printf '%s\n' '{"bundle":{}}' > speech-bundle-config.json
          fi

      - name: Configure Windows publisher signing
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          SIGNER: ${{ vars.WINDOWS_SIGNER_THUMBPRINT }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SIGNER -notmatch '^[0-9a-fA-F]{40}$') { throw 'Configure the Windows publisher certificate on the signing runner' }
          $cert = Get-Item "Cert:/CurrentUser/My/$env:SIGNER"
          if (!$cert.HasPrivateKey) { throw 'The signing runner cannot access the publisher key' }
          if (([uri]$env:TIMESTAMP_URL).Scheme -ne 'https') { throw 'Configure an HTTPS RFC3161 timestamp service' }
          $config = Get-Content speech-bundle-config.json -Raw | ConvertFrom-Json -AsHashtable
          if (!$config.bundle.windows) { $config.bundle.windows = @{} }
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (!$signTool) { throw 'Windows SDK signtool is required' }
          foreach ($base in $config.bundle.externalBin) {
            $sidecar = "$base-x86_64-pc-windows-msvc.exe"
            & $signTool.FullName sign /sha1 $env:SIGNER /fd SHA256 /tr $env:TIMESTAMP_URL /td SHA256 $sidecar
            if ($LASTEXITCODE -ne 0) { throw "Sidecar signature failed for $sidecar" }
          }
          $config.bundle.windows.certificateThumbprint = $env:SIGNER
          $config.bundle.windows.timestampUrl = $env:TIMESTAMP_URL
          $config.bundle.windows.tsp = $true
          $config.bundle.windows.digestAlgorithm = 'sha256'
          $config | ConvertTo-Json -Depth 30 | Set-Content speech-bundle-config.json -Encoding utf8

      - name: Build signed draft artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npx tauri
          tagName: ${{ inputs.tag }}
          releaseName: 彩云笔记 ${{ inputs.tag }}
          releaseBody: Signed candidate. Not promoted to updater manifests yet.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --config speech-bundle-config.json

      - name: Verify Windows installer identity
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          SIGNER: ${{ vars.WINDOWS_SIGNER_THUMBPRINT }}
        run: |
          $files = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          if ($files.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $sig = Get-AuthenticodeSignature -LiteralPath $files[0].FullName
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Thumbprint -ne $env:SIGNER -or !$sig.TimeStamperCertificate) {
            throw 'Installer publisher signature or timestamp failed validation'
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $files[0].FullName

      - name: Verify macOS app bundle signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/彩云笔记.app"
          ARCHIVE="src-tauri/target/${{ matrix.target }}/release/bundle/macos/彩云笔记.app.tar.gz"
          test -f "$APP/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict --verbose=2 "$APP"
          tar -tzf "$ARCHIVE" | grep -q '彩云笔记.app/Contents/_CodeSignature/CodeResources'
          EXTRACTED=$(mktemp -d)
          trap 'rm -rf "$EXTRACTED"' EXIT
          tar -xzf "$ARCHIVE" -C "$EXTRACTED"
          codesign --verify --deep --strict --verbose=2 "$EXTRACTED/彩云笔记.app"

  verify-windows:
    strategy:
      matrix:
        scenario: [clean, '10.2.8', '10.2.13']
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install and inspect the exact draft installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SCENARIO: ${{ matrix.scenario }}
          SIGNER: ${{ vars.WINDOWS_SIGNER_THUMBPRINT }}
        run: |
          gh release download $env:TAG --pattern '*x64-setup.exe' --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          $files = @(Get-ChildItem candidate/*x64-setup.exe)
          if ($files.Count -ne 1) { throw 'Expected one x64 installer' }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          & ./.github/scripts/verify-windows-exe.ps1 -Installer $files[0].FullName -PublisherThumbprint $env:SIGNER -ExpectedVersion $version -Scenario $env:SCENARIO |
            Set-Content windows-certification.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-certification-${{ matrix.scenario }}
          path: windows-certification.json

  qualify-draft:
    needs: [build, verify-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Download draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir candidate
          gh release download "${{ inputs.tag }}" --dir candidate --clobber
      - name: Build candidate report
        run: |
          node .github/scripts/build-candidate-report.cjs \
            --candidate candidate \
            --tauri-config src-tauri/tauri.conf.json \
            --tag "${{ inputs.tag }}" \
            --output candidate-report.json
      - name: Cryptographically verify updater signatures
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          node -e "const fs=require('fs'),c=require('./src-tauri/tauri.conf.json');fs.writeFileSync('updater.pub',Buffer.from(c.plugins.updater.pubkey,'base64'))"
          node -e "const r=require('./candidate-report.json');for(const i of Object.values(r.updater))console.log(i.package+'\\t'+i.signatureFile)" | while IFS=$'\t' read -r package signature; do
            base64 --decode "candidate/$signature" > /tmp/updater.sig
            minisign -Vm "candidate/$package" -p updater.pub -x /tmp/updater.sig
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-certification-*
          path: windows-evidence
      - name: Qualify background installation on both historical Windows versions
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const load = scenario => JSON.parse(fs.readFileSync(
            `windows-evidence/windows-certification-${scenario}/windows-certification.json`, 'utf8').replace(/^\uFEFF/, ''));
          const clean = load('clean');
          clean.quietUpgradeScenarios = ['10.2.8', '10.2.13'].map(scenario => {
            const upgrade = load(scenario);
            if (upgrade.scenario !== scenario || upgrade.quietExitVerified !== true ||
                ['version', 'installerSha256', 'publisherThumbprint'].some(key => upgrade[key] !== clean[key])) {
              throw new Error(`Quiet upgrade evidence failed for ${scenario}`);
            }
            return scenario;
          });
          fs.writeFileSync('windows-certification.json', JSON.stringify(clean));
          JS
      - name: Attach qualification report to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" candidate-report.json windows-certification.json --clobber
