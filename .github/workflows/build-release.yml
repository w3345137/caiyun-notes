name: Build Signed Draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example p10
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate bundled frontend
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/app-dist-manifest.json
          node -e "const p=require('./package.json'),t=require('./src-tauri/tauri.conf.json'),m=require('./dist/app-dist-manifest.json');if(p.version!==t.version||p.version!==m.appVersion||t.app.windows[0].url!=='index.html')process.exit(1)"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build signed draft artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npx tauri
          tagName: ${{ inputs.tag }}
          releaseName: 彩云笔记 ${{ inputs.tag }}
          releaseBody: Signed candidate. Not promoted to updater manifests yet.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  qualify-draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Download draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir candidate
          gh release download "${{ inputs.tag }}" --dir candidate --clobber
      - name: Build candidate report
        run: |
          node .github/scripts/build-candidate-report.cjs \
            --candidate candidate \
            --tauri-config src-tauri/tauri.conf.json \
            --tag "${{ inputs.tag }}" \
            --output candidate-report.json
      - name: Attach qualification report to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" candidate-report.json --clobber
