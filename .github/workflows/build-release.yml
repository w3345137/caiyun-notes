name: Build Signed Draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example p10
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate bundled frontend
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/app-dist-manifest.json
          node -e "const p=require('./package.json'),t=require('./src-tauri/tauri.conf.json'),m=require('./dist/app-dist-manifest.json');if(p.version!==t.version||p.version!==m.appVersion||t.app.windows[0].url!=='index.html')process.exit(1)"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build signed draft artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npx tauri
          tagName: ${{ inputs.tag }}
          releaseName: 彩云笔记 ${{ inputs.tag }}
          releaseBody: Signed candidate. Not promoted to updater manifests yet.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  qualify-draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Download draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir candidate
          gh release download "${{ inputs.tag }}" --dir candidate --clobber
      - name: Build candidate report
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('candidate')
          files = sorted(p for p in root.iterdir() if p.is_file())
          version = json.load(open('src-tauri/tauri.conf.json'))['version']
          def pick(parts, suffix):
              matches = [p for p in files if all(x.lower() in p.name.lower() for x in parts) and p.name.endswith(suffix)]
              if len(matches) != 1: raise SystemExit(f'Expected one {parts} {suffix}, got {[p.name for p in matches]}')
              return matches[0]
          darwin_x64 = [p for p in files if p.name.endswith('.app.tar.gz') and 'aarch64' not in p.name.lower()]
          if len(darwin_x64) != 1: raise SystemExit(f'Expected one darwin x64 updater, got {[p.name for p in darwin_x64]}')
          updater = {
              'darwin-aarch64': pick(['aarch64'], '.app.tar.gz'),
              'darwin-x86_64': darwin_x64[0],
              'windows-x86_64': pick([], '.nsis.zip'),
              'linux-x86_64': pick([], '.AppImage.tar.gz'),
          }
          darwin_x64_dmg = [p for p in files if p.name.endswith('.dmg') and 'aarch64' not in p.name.lower()]
          if len(darwin_x64_dmg) != 1: raise SystemExit('Missing darwin x64 DMG')
          manual = {
              'darwin-aarch64': pick(['aarch64'], '.dmg'),
              'darwin-x86_64': darwin_x64_dmg[0],
              'windows-x86_64': pick([], 'x64-setup.exe'),
              'linux-x86_64': pick([], '_amd64.deb'),
          }
          publish_updater = {
              'darwin-aarch64': f'_{version}_aarch64.app.tar.gz',
              'darwin-x86_64': f'_{version}_x64.app.tar.gz',
              'windows-x86_64': f'_{version}_x64.nsis.zip',
              'linux-x86_64': f'_{version}_amd64.AppImage.tar.gz',
          }
          publish_manual = {
              'darwin-aarch64': f'_{version}_aarch64.dmg',
              'darwin-x86_64': f'_{version}_x64.dmg',
              'windows-x86_64': f'_{version}_x64-setup.exe',
              'linux-x86_64': f'_{version}_amd64.deb',
          }
          report = {'tag': os.environ['TAG'], 'version': version, 'expected_sha256': {}, 'updater': {}}
          for platform, package in updater.items():
              signature = pathlib.Path(str(package) + '.sig')
              if not signature.exists() or not signature.read_text().strip(): raise SystemExit(f'Missing signature for {package.name}')
              report['expected_sha256'][package.name] = hashlib.sha256(package.read_bytes()).hexdigest()
              report['updater'][platform] = {'package': package.name, 'signatureFile': signature.name, 'publishName': publish_updater[platform]}
          report['manual'] = {}
          for platform, package in manual.items():
              report['expected_sha256'][package.name] = hashlib.sha256(package.read_bytes()).hexdigest()
              report['manual'][platform] = {'package': package.name, 'publishName': publish_manual[platform]}
          pathlib.Path('candidate-report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Attach qualification report to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" candidate-report.json --clobber
