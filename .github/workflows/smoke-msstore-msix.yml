name: Smoke test submitted MSIX

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build MS Store workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  install-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: caiyun-notes-msix-${{ inputs.build_run_id }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: original

      - name: Verify original package and install a temporary signed copy
        timeout-minutes: 5
        shell: pwsh
        env:
          EXPECTED_SHA256: f5c50a84ab94a844f40e9c559c0d7dc84a4cba253be45a25e97739c1f5910dd0
          EXPECTED_PUBLISHER: CN=49D17C52-EB55-4439-9F79-0DFACFCB393C
          EXPECTED_NAME: BinApp.547813EA77836
        run: |
          $ErrorActionPreference = 'Stop'
          $original = Get-ChildItem original -Filter *.msix -Recurse | Select-Object -First 1
          if (-not $original) { throw 'MSIX artifact missing' }
          $hash = (Get-FileHash $original.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:EXPECTED_SHA256) { throw "Submitted artifact hash mismatch: $hash" }
          Write-Host 'Original MSIX hash verified.'

          $qaCopy = Join-Path $env:RUNNER_TEMP 'CaiyunNotes-qa-signed.msix'
          Copy-Item -LiteralPath $original.FullName -Destination $qaCopy
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $env:EXPECTED_PUBLISHER `
            -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable
          $certPath = Join-Path $env:RUNNER_TEMP 'caiyun-qa.cer'
          Export-Certificate -Cert $cert -FilePath $certPath | Out-Null
          Import-Certificate -FilePath $certPath -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Import-Certificate -FilePath $certPath -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Write-Host 'Temporary QA certificate trusted on isolated runner.'
          $sdkDir = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $signTool = Get-ChildItem $sdkDir -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signTool) { throw 'signtool.exe missing' }
          & $signTool.FullName sign /fd sha256 /sha1 $cert.Thumbprint $qaCopy
          if ($LASTEXITCODE -ne 0) { throw "SignTool failed: $LASTEXITCODE" }
          Write-Host 'Temporary QA copy signed.'

          Write-Host 'Installing temporary QA MSIX...'
          Add-AppxPackage -Path $qaCopy -ErrorAction Stop
          $package = Get-AppxPackage -Name $env:EXPECTED_NAME
          if (-not $package) { throw 'Package was not registered after install' }
          if ($package.Publisher -ne $env:EXPECTED_PUBLISHER) {
            throw "Publisher mismatch: $($package.Publisher)"
          }
          if ($package.Version.ToString() -ne '10.2.8.0') {
            throw "Version mismatch: $($package.Version)"
          }
          Write-Host "Installed package: $($package.PackageFullName)"
          Write-Host 'Original MSIX remains unsigned and byte-for-byte unchanged.'

      - name: Check packaged application starts
        timeout-minutes: 2
        shell: pwsh
        env:
          EXPECTED_NAME: BinApp.547813EA77836
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --remote-debugging-port=19382
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-AppxPackage -Name $env:EXPECTED_NAME
          if (-not $package) { throw 'Installed package missing before launch smoke' }
          $exe = Join-Path $package.InstallLocation 'app\app.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Packaged executable missing: $exe"
          }
          $debugPolicy = 'HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $debugPolicy -Force | Out-Null
          New-ItemProperty -Path $debugPolicy -Name 'app.exe' -Value '--remote-debugging-port=19382' -PropertyType String -Force | Out-Null
          Write-Host "Launching packaged executable: $exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "Packaged app exited within 8 seconds (exit code $($process.ExitCode))"
          }
          Write-Host "Packaged app remained running (PID $($process.Id))."
          $allProcesses = @(Get-CimInstance Win32_Process | Select-Object ProcessId, ParentProcessId, Name, CommandLine)
          $descendantIds = @($process.Id)
          do {
            $previousCount = $descendantIds.Count
            $children = @($allProcesses | Where-Object { $descendantIds -contains $_.ParentProcessId })
            $descendantIds = @($descendantIds + @($children | ForEach-Object { $_.ProcessId }) | Select-Object -Unique)
          } while ($descendantIds.Count -gt $previousCount)
          $descendants = @($allProcesses | Where-Object { $descendantIds -contains $_.ProcessId })
          $descendants | Select-Object ProcessId, ParentProcessId, Name | Format-Table -AutoSize | Out-String | Write-Host
          $webviewProcesses = @($descendants | Where-Object { $_.Name -ieq 'msedgewebview2.exe' })
          Write-Host "WebView2 descendant process count: $($webviewProcesses.Count)"
          if ($webviewProcesses.Count -eq 0) {
            throw 'Packaged app stayed alive but did not start a WebView2 process'
          }
          foreach ($webview in $webviewProcesses) {
            if ($webview.CommandLine -match '--user-data-dir=(?:"([^"]+)"|(\S+))') {
              $dataDir = if ($Matches[1]) { $Matches[1] } else { $Matches[2] }
              Write-Host "WebView2 user data directory: $dataDir"
              $privateDir = Join-Path $env:LOCALAPPDATA "Packages\$($package.PackageFamilyName)\LocalCache\Local\com.caiyun.notes\EBWebView"
              Write-Host "Host-visible WebView2 directory exists: $(Test-Path -LiteralPath $dataDir)"
              Write-Host "MSIX-private WebView2 directory exists: $(Test-Path -LiteralPath $privateDir)"
              break
            }
          }
          try {
            $targets = @(Invoke-RestMethod 'http://127.0.0.1:19382/json/list' -TimeoutSec 5)
            Write-Host "WebView2 CDP target count: $($targets.Count)"
            $targets | ForEach-Object { Write-Host "WebView2 target origin: $(([uri]$_.url).GetLeftPart('Authority'))" }
          } catch {
            Write-Host "WebView2 CDP probe unavailable: $($_.Exception.Message)"
          }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          Write-Host 'This is a headless process smoke, not a GUI/login/WebView2 acceptance test.'

      - name: Remove temporary QA install
        if: always()
        shell: pwsh
        run: |
          Remove-ItemProperty -Path 'HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments' -Name 'app.exe' -ErrorAction SilentlyContinue
          Get-AppxPackage -Name 'BinApp.547813EA77836' | Remove-AppxPackage -ErrorAction Continue
          $certPath = Join-Path $env:RUNNER_TEMP 'caiyun-qa.cer'
          if (Test-Path $certPath) {
            $thumbprint = (Get-PfxCertificate -FilePath $certPath).Thumbprint
            Remove-Item "Cert:\LocalMachine\Root\$thumbprint" -ErrorAction SilentlyContinue
            Remove-Item "Cert:\LocalMachine\TrustedPeople\$thumbprint" -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\My\$thumbprint" -ErrorAction SilentlyContinue
          }
