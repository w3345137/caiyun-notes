name: Verify Windows Store legacy handoff
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Candidate Windows build run
        required: true
        type: string
      expected_sha256:
        description: Exact candidate SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      CANDIDATE_SHA: ${{ inputs.expected_sha256 }}
      PACKAGE_NAME: BinApp.547813EA77836
      PUBLISHER: CN=49D17C52-EB55-4439-9F79-0DFACFCB393C
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: caiyun-notes-msix-${{ inputs.build_run_id }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: caiyun-notes-msix-44109331842
          run-id: 44109331842
          github-token: ${{ github.token }}
          path: previous
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact legacy NSIS and sign QA copies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $oldExe = Join-Path $env:RUNNER_TEMP 'p20-setup.exe'
          Invoke-WebRequest 'https://github.com/w3345137/caiyun-notes/releases/download/p20/_10.2.8_x64-setup.exe' -OutFile $oldExe
          if ((Get-FileHash $oldExe).Hash.ToLowerInvariant() -ne '658bba8c12ecbc794977077f4360c63eb2c24f0a1e207e5a10498bab7eab970a') { throw 'p20 source hash mismatch' }
          $setup = Start-Process -FilePath $oldExe -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'NSIS install failed' }
          $legacy = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\彩云笔记'
          if ($legacy.DisplayVersion -ne '10.2.8' -or $legacy.MainBinaryName -ne 'app.exe') { throw 'Legacy registration mismatch' }
          Write-Host ('Legacy installer registered ' + $legacy.DisplayVersion)
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $env:PUBLISHER -CertStoreLocation Cert:\CurrentUser\My
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\caiyun.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\caiyun.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\caiyun.cer" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $sign = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object FullName -Match '\\x64\\' | Sort-Object FullName | Select-Object -Last 1
          foreach ($entry in @(@{ Name='previous'; Hash='6fa0bb4f60923e5503356776bf99f4242e044d6f1a4430547516a9c5aad911d3' }, @{ Name='candidate'; Hash=$env:CANDIDATE_SHA })) {
            $file = Get-ChildItem $entry.Name -Filter '*.msix' -Recurse | Select-Object -First 1
            if (-not $file -or (Get-FileHash $file.FullName).Hash.ToLowerInvariant() -ne $entry.Hash) { throw 'MSIX hash mismatch' }
            $copy = Join-Path $env:RUNNER_TEMP ($entry.Name + '-signed.msix')
            Copy-Item -LiteralPath $file.FullName -Destination $copy
            & $sign.FullName sign /fd sha256 /sha1 $cert.Thumbprint $copy
            if ($LASTEXITCODE -ne 0) { throw 'MSIX test signing failed' }
          }
      - name: Test fresh installation and upgrade from coexisting versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $new = Join-Path $env:RUNNER_TEMP 'candidate-signed.msix'
          $old = Join-Path $env:RUNNER_TEMP 'previous-signed.msix'
          $legacyKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\彩云笔记'
          Add-AppxPackage -Path $new
          $fresh = Get-AppxPackage -Name $env:PACKAGE_NAME
          if ($fresh.Version.ToString() -ne '10.2.16.0' -or -not (Test-Path $legacyKey)) { throw 'Fresh install mismatch' }
          Write-Host "Fresh MSIX install beside p20: $($fresh.PackageFullName)"
          Remove-AppxPackage -Package $fresh.PackageFullName
          Add-AppxPackage -Path $old
          $prior = Get-AppxPackage -Name $env:PACKAGE_NAME
          if ($prior.Version.ToString() -ne '10.2.15.0' -or -not (Test-Path $legacyKey)) { throw 'Coexistence setup mismatch' }
          Add-AppxPackage -Path $new
          $updated = Get-AppxPackage -Name $env:PACKAGE_NAME
          if ($updated.Version.ToString() -ne '10.2.16.0' -or $updated.PackageFamilyName -ne $prior.PackageFamilyName) { throw 'Store in-place upgrade mismatch' }
          $manifest = Get-AppxPackageManifest -Package $updated.PackageFullName
          $alias = $manifest.SelectSingleNode("//*[local-name()='Extension' and @Category='windows.desktopAppMigration']")
          if (-not $alias -or $alias.SelectNodes(".//*[local-name()='DesktopApp']").Count -ne 4) { throw 'Shortcut migration declaration missing' }
          Write-Host "Store in-place upgrade and migration manifest passed: $($updated.PackageFullName)"
      - name: Exercise retirement in the real packaged WebView
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-AppxPackage -Name $env:PACKAGE_NAME
          $legacyKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\彩云笔记'
          $location = (Get-ItemProperty $legacyKey).InstallLocation.Trim('"')
          $legacyExe = Join-Path $location 'app.exe'
          $hash = (Get-FileHash $legacyExe).Hash
          $appData = Join-Path $env:LOCALAPPDATA 'com.caiyun.notes'
          New-Item -ItemType Directory -Path $appData -Force | Out-Null
          $marker = Join-Path $appData 'ci-offline-data.txt'
          Set-Content -LiteralPath $marker -Value 'isolated offline data'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=19222 --remote-debugging-address=127.0.0.1'
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name '*' -Value $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS -PropertyType String -Force | Out-Null
          $legacyProcess = Start-Process -FilePath $legacyExe -WorkingDirectory $location -PassThru
          try {
            node scripts/verify-legacy-handoff-runtime.mjs legacy
            if ($LASTEXITCODE -ne 0) { throw 'Legacy profile fixture write failed' }
          } finally {
            if (-not $legacyProcess.HasExited) {
              taskkill /PID $legacyProcess.Id /T /F | Out-Null
              if (-not $legacyProcess.WaitForExit(10000)) { throw 'Legacy process did not exit' }
            }
          }
          $stillRunning = Get-CimInstance Win32_Process -Filter "Name = 'app.exe'" | Where-Object ExecutablePath -EQ $legacyExe
          if ($stillRunning) { throw 'Legacy program still running after the isolated test shutdown' }
          $process = Start-Process -FilePath (Join-Path $package.InstallLocation 'app\app.exe') -WorkingDirectory (Join-Path $package.InstallLocation 'app') -PassThru
          try {
            node scripts/verify-legacy-handoff-runtime.mjs
            if ($LASTEXITCODE -ne 0) {
              $versionAfter = (Get-ItemProperty $legacyKey -ErrorAction SilentlyContinue).DisplayVersion
              $originalExists = Test-Path -LiteralPath $location
              $backupExists = Test-Path -LiteralPath ($location + '.legacy-program-10.2.8')
              Write-Host "After failed handoff: old registration=$versionAfter, original=$originalExists, backup=$backupExists"
              throw 'Packaged retirement IPC failed'
            }
            if (Test-Path $legacyKey) { throw 'Old registration still present in the Windows user registry' }
            if (Test-Path -LiteralPath $location) { throw 'Old program path still active' }
            $backupExe = Join-Path ($location + '.legacy-program-10.2.8') 'app.exe'
            if ((Get-FileHash $backupExe).Hash -ne $hash -or (Get-Content $marker -Raw).Trim() -ne 'isolated offline data') { throw 'Program backup or local data did not survive retirement' }
            $process.Refresh()
            if ($process.HasExited) { throw 'Store app stopped during retirement' }
            Write-Host 'Legacy program retired; store app, archived program and offline data survived'
          } finally {
            if (-not $process.HasExited) { taskkill /PID $process.Id /T /F | Out-Null }
            Remove-ItemProperty -Path $policy -Name '*' -ErrorAction SilentlyContinue
          }
