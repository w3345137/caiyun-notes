name: Verify Microsoft Store update and legacy coexistence

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        required: true
        type: string
      launch_probe:
        description: Check activation through the Store entry while the legacy EXE is running
        required: false
        default: false
        type: boolean

      entry_only:
        description: Verify native entries and tray handoff separately from the offline draft test
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        legacy:
          - {tag: p20, version: '10.2.8', sha256: '658bba8c12ecbc794977077f4360c63eb2c24f0a1e207e5a10498bab7eab970a'}
          - {tag: p25, version: '10.2.13', sha256: '7dad87f4e18698973bcf4a12b382aed726c06b7fcd36527e57351f4dce201a3a'}
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: caiyun-notes-msix-44109331842
          run-id: '44109331842'
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: caiyun-notes-msix-${{ inputs.build_run_id }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Exercise Windows package installation and upgrade
        shell: pwsh
        env:
          ENTRY_ONLY: ${{ inputs.entry_only }}
          LAUNCH_PROBE: ${{ inputs.launch_probe }}
          GH_TOKEN: ${{ github.token }}
          LEGACY_TAG: ${{ matrix.legacy.tag }}
          LEGACY_VERSION: ${{ matrix.legacy.version }}
          LEGACY_SHA256: ${{ matrix.legacy.sha256 }}
        run: ./scripts/verify-msstore-upgrade.ps1
