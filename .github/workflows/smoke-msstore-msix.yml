name: Smoke test submitted MSIX

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build MS Store workflow run ID
        required: true
        type: string
      expected_sha256:
        description: Exact SHA-256 of the unsigned MSIX to install
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  install-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated audit dependencies
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/qa-msix-deps" --no-audit --no-fund playwright-core@1.58.2 yjs@13.6.30 @hocuspocus/server@4.0.0 ws@8
          if ($LASTEXITCODE -ne 0) { throw 'Audit dependencies unavailable' }

      - name: Repeat the same notes and sync audit with the official direct Windows executable
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=18495 --remote-debugging-address=127.0.0.1'
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name '*' -Value $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS -PropertyType String -Force | Out-Null
          $directSetup = Join-Path $env:RUNNER_TEMP 'CaiyunNotes-direct-10.2.13.exe'
          curl.exe --fail --silent --show-error --location --max-time 35 'https://github.com/w3345137/caiyun-notes/releases/download/p25/_10.2.13_x64-setup.exe' -o $directSetup
          if ($LASTEXITCODE -ne 0) { throw 'Download of official direct installer failed' }
          $directPayload = Join-Path $env:RUNNER_TEMP 'direct-p25'
          & 'C:\Program Files\7-Zip\7z.exe' x "-o$directPayload" $directSetup 'app.exe' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Extracting the official direct app failed' }
          $directExe = Join-Path $directPayload 'app.exe'
          $process = Start-Process -FilePath $directExe -WorkingDirectory $directPayload -PassThru
          try {
            node scripts/probe-msstore-plugin-ipc.mjs direct
            if ($LASTEXITCODE -ne 0) { throw 'Direct app startup probe failed' }
            node scripts/probe-msstore-plugin-ipc.mjs bundled
            if ($LASTEXITCODE -ne 0) { throw 'Direct signed update probe failed' }
          } finally {
            taskkill /PID $process.Id /T /F | Out-Null
          }
          $results = @{}
          foreach ($phase in @('edit','weak-auth','recover')) {
            $process = Start-Process -FilePath $directExe -WorkingDirectory $directPayload -PassThru
            try {
              if ($phase -eq 'edit') {
                node scripts/probe-msstore-plugin-ipc.mjs restarted
                if ($LASTEXITCODE -ne 0) { throw 'Direct reload probe failed' }
              }
              node scripts/audit-msix-notes.mjs $phase
              $results[$phase] = $LASTEXITCODE
            } finally {
              taskkill /PID $process.Id /T /F | Out-Null
            }
          }
          Write-Host "Direct audit results: $($results | ConvertTo-Json -Compress)"
          if (($results.Values | Where-Object { $_ -ne 0 }).Count -gt 0) {
            throw 'Direct comparison found a failing path'
          }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: msix-fixture-failure-evidence
          path: ${{ runner.temp }}/msix-audit-*.png
          if-no-files-found: ignore
