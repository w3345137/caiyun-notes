name: Verify Microsoft Store update and legacy coexistence

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: caiyun-notes-msix-44109331842
          run-id: '44109331842'
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: caiyun-notes-msix-${{ inputs.build_run_id }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Exercise Windows package installation and upgrade
        shell: pwsh
        run: ./scripts/verify-msstore-upgrade.ps1
