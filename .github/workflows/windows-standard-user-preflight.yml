name: Windows standard account baseline
on:
  push:
    branches: [qa/windows-standard-user-preflight]
permissions:
  contents: read
jobs:
  baseline:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Fetch known historical installers
        shell: pwsh
        run: |
          $dir = 'C:\CaiyunQA'
          New-Item -ItemType Directory $dir | Out-Null
          foreach ($item in @(
            @('10.2.8','p20','658bba8c12ecbc794977077f4360c63eb2c24f0a1e207e5a10498bab7eab970a'),
            @('10.2.13','p25','7dad87f4e18698973bcf4a12b382aed726c06b7fcd36527e57351f4dce201a3a'))) {
            $version,$tag,$sha = $item
            $path = "$dir\$version.exe"
            Invoke-WebRequest "https://github.com/w3345137/caiyun-notes/releases/download/$tag/_${version}_x64-setup.exe" -OutFile $path
            if ((Get-FileHash $path).Hash -ne $sha) { throw "Unexpected $version package" }
            Write-Host "$version Authenticode $((Get-AuthenticodeSignature $path).Status)"
          }
      - name: Fetch the exact private draft candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download qa-windows-bridge-10.2.19-20261126101339 --repo w3345137/caiyun-notes --pattern '_10.2.19_x64-setup.exe' --dir 'C:\CaiyunQA'
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash 'C:\CaiyunQA\_10.2.19_x64-setup.exe').Hash -ne '956359fb6ef98f61c2896dcf77ee837d8686f26dc5268951aaabf7d02bc32e52') { throw 'Wrong candidate' }
          @'
          $ErrorActionPreference = 'Stop'
          $minimum = [version]$env:CAIYUN_STORE_MINIMUM
          function Get-VerifiedPackage {
              Get-AppxPackage -Name 'BinApp.547813EA77836' | Where-Object {
                  $_.PackageFamilyName -eq 'BinApp.547813EA77836_hex6nfb75njyr' -and
                  $_.Status -eq 'Ok' -and $_.Architecture -eq 'X64' -and $_.SignatureKind -eq 'Store'
              } | Sort-Object { [version]$_.Version } -Descending | Select-Object -First 1
          }
          $before = Get-VerifiedPackage
          if ($before -and [version]$before.Version -ge $minimum) { exit 0 }
          $installer = Get-AppxPackage -Name 'Microsoft.DesktopAppInstaller' | Where-Object {
              $_.PackageFamilyName -eq 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe' -and $_.Status -eq 'Ok'
          } | Select-Object -First 1
          if (!$installer) { exit 2 }
          $winget = Join-Path $installer.InstallLocation 'winget.exe'
          if (!(Test-Path -LiteralPath $winget -PathType Leaf)) { exit 2 }
          $verb = if ($before) { 'upgrade' } else { 'install' }
          & $winget $verb --id 9P2VQP7JKVLN --exact --source msstore --silent --disable-interactivity
          $after = Get-VerifiedPackage
          if ($after -and [version]$after.Version -ge $minimum) { exit 0 }
          exit 2
          '@ | Set-Content 'C:\CaiyunQA\acquire.ps1' -Encoding utf8BOM
      - name: Install and upgrade as a non-administrator
        shell: pwsh
        run: |
          $password = 'Qa!' + [guid]::NewGuid().ToString('N')
          New-LocalUser -Name 'CaiyunQA' -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          $dir = 'C:\CaiyunQA'
          New-Item -ItemType Directory "$dir\result" | Out-Null
          Add-LocalGroupMember -SID 'S-1-5-32-545' -Member 'CaiyunQA'
          icacls $dir /grant 'CaiyunQA:(OI)(CI)RX' | Out-Null
          icacls "$dir\result" /grant 'CaiyunQA:(OI)(CI)M' | Out-Null
          @'
          $ErrorActionPreference = 'Stop'
          try {
            $user = [Security.Principal.WindowsIdentity]::GetCurrent()
            $adminSid = 'S-1-5-32-544'
            if ($user.Name -notlike '*\CaiyunQA' -or $adminSid -in $user.Groups.Value) { throw 'Not a standard user' }
            $base = 'C:\CaiyunQA'
            $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\彩云笔记'
            foreach ($family in @(Get-Content "$base\inbox.json" -Raw | ConvertFrom-Json)) {
              if ($family -and !(Get-AppxPackage | Where-Object PackageFamilyName -eq $family)) {
                try { Add-AppxPackage -RegisterByFamilyName -MainPackage $family -ErrorAction Stop }
                catch { "Inbox registration unavailable: $family" | Out-File "$base\result\inbox-log" -Append }
              }
            }
            $stores = @(Get-AppxPackage Microsoft.WindowsStore).Count
            $installers = @(Get-AppxPackage Microsoft.DesktopAppInstaller).Count
            "Standard user; Store registrations=$stores; AppInstaller registrations=$installers" | Out-File "$base\result\log"
            if ($stores -and $installers) {
              $winget = Join-Path (Get-AppxPackage Microsoft.DesktopAppInstaller | Select-Object -First 1).InstallLocation 'winget.exe'
              & $winget install --id 9P2VQP7JKVLN --exact --source msstore --silent --disable-interactivity *> "$base\result\winget.txt"
              $pkg = Get-AppxPackage -Name BinApp.547813EA77836
              "Store acquisition exit=$LASTEXITCODE family=$($pkg.PackageFamilyName) version=$($pkg.Version) signing=$($pkg.SignatureKind)" | Out-File "$base\result\log" -Append
            }
            $initialDirectory = $null
            foreach ($v in @('10.2.8','10.2.13','10.2.19')) {
              $argsList = if ($v -eq '10.2.8') { "/S /D=$base\result\app" } else { '/S /UPDATE' }
              $setup = "$base\$v.exe"
              if ($v -eq '10.2.19') {
                $env:CAIYUN_STORE_MINIMUM = '10.2.18.0'
                & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NonInteractive -NoProfile -File "$base\acquire.ps1"
                $code = $LASTEXITCODE
                "Candidate Store probe exit=$code" | Out-File "$base\result\log" -Append
                if ($code -eq 0) { "Verified Store registration; EXE skipped" | Out-File "$base\result\log" -Append; break }
                if ($code -ne 2) { throw "Unexpected acquisition failure $code" }
                $setup = "$base\_10.2.19_x64-setup.exe"
              }
              $p = Start-Process $setup -ArgumentList $argsList -PassThru
              if (!$p.WaitForExit(120000)) { throw "Install timeout $v" }
              $installed = Get-ItemProperty $key
              if ($p.ExitCode -ne 0 -or $installed.DisplayVersion -ne $v) { throw "Install failed $v" }
              $directory = ([string]$installed.InstallLocation).Trim('"')
              if (!$directory) { $directory = Split-Path (([string]$installed.UninstallString).Trim('"')) }
              if ($directory -ne "$base\result\app" -or !(Test-Path -LiteralPath (Join-Path $directory 'app.exe'))) {
                throw "Installed binary missing; registry directory=$directory"
              }
              if ($initialDirectory -and $initialDirectory -ne $directory) { throw "Install location changed" }
              if ($v -eq '10.2.19' -and (Get-Item (Join-Path $directory 'app.exe')).VersionInfo.ProductVersion -notlike '10.2.19*') { throw 'Unexpected installed app version' }
              $initialDirectory = $directory
              "Installed $v in same current-user directory" | Out-File "$base\result\log" -Append
            }
            exit 0
          } catch { $_ | Out-File 'C:\CaiyunQA\result\log' -Append; exit 1 }
          '@ | Set-Content "$dir\verify.ps1" -Encoding utf8BOM
          $catalog = @(Get-AppxPackage -AllUsers | Where-Object { $_.Name -in @('Microsoft.WindowsStore','Microsoft.DesktopAppInstaller') -and $_.InstallLocation } | Select-Object -ExpandProperty PackageFamilyName -Unique)
          ConvertTo-Json -InputObject @($catalog) | Set-Content "$dir\inbox.json"
          $credential = [pscredential]::new("$env:COMPUTERNAME\CaiyunQA",(ConvertTo-SecureString $password -AsPlainText -Force))
          $p = Start-Process -Credential $credential -LoadUserProfile -WorkingDirectory $dir -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList "-NoProfile -NonInteractive -File $dir\verify.ps1" -PassThru -Wait
          Get-Content "$dir\result\log"
          if ($p.ExitCode -ne 0) { throw 'Standard-user baseline failed' }
