[package]
name = "caiyun-qwen-cpu"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "CaiyunQwenCpu"
path = "src/main.rs"

[dependencies]
qwen3-asr = { version = "=0.2.2", default-features = false }
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
