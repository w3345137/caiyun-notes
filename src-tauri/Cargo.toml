[package]
name = "app"
version = "10.2.8"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
serde_json = "1.0"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
hex = "0.4"
mime_guess = "2.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
futures-util = "0.3"
minisign-verify = "0.2"
tokio = { version = "1", features = ["time"] }
semver = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "unstable", "webview-data-url"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3.20"

[features]
# 默认 = 官网直发版：保留整包自更新 + 前端热更新。
# 商店版构建使用 --no-default-features --features frontend-hot-update
# （上架应用商店必须移除整包自更新；热更新按各商店政策保留，可用开关单独关闭）。
default = ["self-update", "frontend-hot-update"]
self-update = ["dep:tauri-plugin-updater"]
frontend-hot-update = []
map-isolation-test = []
