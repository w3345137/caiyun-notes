[package]
name = "app"
version = "10.2.21"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.2"
tauri-build = { version = "2.5.6", features = [] }
serde_json = "1.0"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
hex = "0.4"
mime_guess = "2.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
futures-util = "0.3"
minisign-verify = "0.2"
tokio = { version = "1", features = ["time"] }
semver = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
log = "0.4"
tempfile = "3.20"
tauri = { version = "2.10.3", features = ["tray-icon", "unstable", "webview-data-url"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tokio = { version = "1", features = ["fs", "io-util", "process", "sync"] }

[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "=1.0.7"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"
windows = { version = "0.61.3", features = ["ApplicationModel", "Services_Store", "Data_Xml_Dom", "UI_Notifications", "Win32_Storage_Packaging_Appx", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WinRT"] }

[features]
default = ["self-update", "frontend-hot-update"]
self-update = ["dep:tauri-plugin-updater"]
frontend-hot-update = []
msstore-distribution = []
appstore-distribution = []
map-isolation-test = []
