    .cy-boot-secondary { color: #374151; font-size: 14px; font-weight: 550; }

    .cy-boot-titlebar span { margin-left: 10px; }
    .cy-boot-window-body { display: grid; grid-template-columns: 168px 1fr; min-height: 330px; }
    .cy-boot-side { padding: 18px 14px; border-right: 1px solid #eef1f6; background: #fafbfd; }

    .cy-boot-side i:nth-child(3) { width: 62%; }
    .cy-boot-side i:nth-child(4) { width: 70%; }
    .cy-boot-side i:nth-child(5) { width: 55%; }
    .cy-boot-doc { padding: 26px 30px; }
    .cy-boot-doc h2 { margin: 0 0 18px; font-size: 20px; letter-spacing: -.02em; }
    .cy-boot-doc p { height: 11px; margin: 0 0 12px; border-radius: 6px; background: #eef1f6; }
    .cy-boot-doc p.short { width: 58%; }
    @media (max-width: 900px) {
      .cy-boot-hero { grid-template-columns: 1fr; gap: 34px; text-align: center; }
      .cy-boot h1, .cy-boot-sub { margin-inline: auto; }
      .cy-boot-actions, .cy-boot-points { justify-content: center; }
